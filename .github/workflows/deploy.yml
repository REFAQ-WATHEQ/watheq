name: Deploy to Cloudflare Workers
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Build
        run: |
          echo "VITE_SUPABASE_URL=https://vfndtiiztccebdfkaxaq.supabase.co" >> .env
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" >> .env
          npm run build
      - name: Set secrets
        run: |
          echo "${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" | npx wrangler@4 secret put SUPABASE_PUBLISHABLE_KEY --config wrangler.json
          echo "https://vfndtiiztccebdfkaxaq.supabase.co" | npx wrangler@4 secret put SUPABASE_URL --config wrangler.json
          echo "${{ secrets.RESEND_API_KEY }}" | npx wrangler@4 secret put RESEND_API_KEY --config wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy
        run: npx wrangler@4 deploy --config wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
